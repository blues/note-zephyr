# USB CDC ACM console on the Swan.
#
# Deliberately the *legacy* USB device stack, not USB_DEVICE_STACK_NEXT.
# swan_r5.yaml declares `usb_device` but not `usbd`, i.e. the board claims
# support for this stack and not the new one, and upstream's new-stack CDC ACM
# sample lists no STM32L4 among its integration platforms (F4 and F7 only).
# Built against the new stack the image links clean and then never enumerates,
# which is invisible here because the only console is the USB device that
# failed to come up. The legacy usb_dc_stm32 driver is what every STM32L4 USB
# sample has used for years.
CONFIG_USB_DEVICE_STACK=y
CONFIG_USB_CDC_ACM=y

# Bring USB up during system init, so nothing is required of the application.
CONFIG_USB_DEVICE_INITIALIZE_AT_BOOT=y

# Present the USB VID/PID a Notestation expects for a Swan's mcu_usb.
#
# This is what makes the console reachable at all. A Notestation names its
# devices with a udev rule that matches on VID/PID:
#
#   SUBSYSTEM=="tty", ATTRS{idVendor}=="30a4", ATTRS{idProduct}=="0002", \
#     MODE="0666", SYMLINK+="<hostname>_mcu_usb"
#
# and the server opens /dev/<hostname>_mcu_usb by that name. Zephyr's defaults
# are 2fe3:0100, which matches no rule, so udev never creates the node: the
# board enumerates perfectly and is simply never named, the server's open fails
# with ENOENT forever, and the reservation's host_mcu_usb symlink never
# appears. 30a4 is Blues' own vendor ID and 0002 is the Swan's mcu_usb product
# ID, per the VID/PID map in the notestation repo's ADMIN.md.
CONFIG_USB_DEVICE_VID=0x30A4
CONFIG_USB_DEVICE_PID=0x0002

CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_UART_LINE_CTRL=y

# The console device disappears while the board is flashed and comes back only
# once USB has re-enumerated. The delay is counted from reset, so it has to
# outlast re-enumeration *plus* the reader reopening the port -- otherwise the
# board prints its first line into a port nobody is listening on, and that line
# is gone for good. blinky prints nothing after "Entering main loop", so losing
# it means the smoke test simply waits out its timeout in silence.
#
# Measured re-enumeration on barcelona-notestation-1: 1.0s on one run, 4.5s on
# the next. 3000ms lost the race on the 4.5s one. 10s is deliberate margin over
# the worst observed, not a tuned value.
CONFIG_BOOT_DELAY=10000
