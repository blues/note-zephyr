# Kconfig fragment for the blinky smoke test.
#
# The examples leave CONFIG_BLUES_NOTEHUB_PRODUCT_UID empty so that users set
# their own. blinky logs an error and returns early if its startup hub.set
# fails, and an empty product is exactly the case that trips that -- so the
# smoke test supplies one. Nothing is ever synced, so it only has to be
# well-formed, not a project anyone owns.
CONFIG_BLUES_NOTEHUB_PRODUCT_UID="com.blues.note-zephyr.hil"
