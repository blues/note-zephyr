# Logging
CONFIG_LOG=y

# Notecard libraries
CONFIG_NEWLIB_LIBC=y # Required by `note-c`
CONFIG_BLUES_NOTECARD=y
# Optional: Enable Notecard logging
CONFIG_BLUES_NOTECARD_LOGGING=y

# Heap must be large enough for the COBS-encoded receive buffer (~4875 bytes for
# the 4854-byte Blues logo payload). 8192 gives comfortable headroom.
CONFIG_HEAP_MEM_POOL_SIZE=8192
