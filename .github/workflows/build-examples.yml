---
name: Build Examples

on:
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        example:
          - blinky
          - message-queues
          - shell
          - outboard-dfu
          # NOTE: mcuboot-blinky is intentionally excluded. It targets the
          # Adafruit Feather nRF52840 (not swan_r5) and builds MCUboot via a
          # child image, so it does not fit this swan_r5 + overlay matrix.
        overlay:
          - i2c.overlay
          - uart.overlay
        zephyr-version:
          - v3.7.0
          - v4.3.0
          - v4.4.0
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          path: note-zephyr
          fetch-depth: 1
          submodules: recursive

      - name: Set Zephyr version
        run: |
          sed -i 's/revision: .*/revision: ${{ matrix.zephyr-version }}/' note-zephyr/west.yml

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.12

      - name: Setup Zephyr project
        uses: zephyrproject-rtos/action-zephyr-setup@v1
        with:
          app-path: note-zephyr
          toolchains: arm-zephyr-eabi

      - name: Build ${{ matrix.example }} with ${{ matrix.overlay }} (Zephyr ${{ matrix.zephyr-version }})
        working-directory: note-zephyr/examples/${{ matrix.example }}
        shell: bash
        run: |
          west build -p -b swan_r5 . -- -DDTC_OVERLAY_FILE=../overlays/${{ matrix.overlay }}
