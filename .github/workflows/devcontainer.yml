---
name: Build Devcontainer Image

on:
  push:
    branches: [main]
    paths:
      - .devcontainer/Dockerfile
      - .github/workflows/devcontainer.yml
      - west.yml
  pull_request:
    branches: [main]
    paths:
      - .devcontainer/Dockerfile
      - .github/workflows/devcontainer.yml
      - west.yml
  # west.yml tracks zephyr's main branch, so rebuild periodically to stop the
  # workspace baked into the image drifting too far from it.
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

# Building this image is expensive; do not leave superseded runs going.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/note-zephyr-devcontainer

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            zsdk-arch: x86_64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            zsdk-arch: aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # The Zephyr CI base image alone unpacks to well over 10 GB, which does
      # not fit alongside the runner's pre-installed toolchains.
      - name: Free up disk space
        run: |
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /usr/local/share/boost \
            /opt/ghc \
            /opt/hostedtoolcache
          df -h /

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Pull requests build to validate the Dockerfile without publishing.
      # Everything else pushes by digest so that the merge job can assemble a
      # single multi-arch tag from both runners.
      - name: Select build output
        id: output
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            echo "spec=type=cacheonly" >> "$GITHUB_OUTPUT"
          else
            echo "spec=type=image,name=${IMAGE},push-by-digest=true,name-canonical=true,push=true" \
              >> "$GITHUB_OUTPUT"
          fi
        shell: bash

      - name: Build ${{ matrix.platform }} image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .devcontainer/Dockerfile
          platforms: ${{ matrix.platform }}
          provenance: false
          build-args: |
            ZSDK_ARCH=${{ matrix.zsdk-arch }}
          outputs: ${{ steps.output.outputs.spec }}

      - name: Export digest
        if: github.event_name != 'pull_request'
        run: |
          digest="${{ steps.build.outputs.digest }}"
          mkdir -p /tmp/digests
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.zsdk-arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-arch manifest
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            --tag "${IMAGE}:latest" \
            --tag "${IMAGE}:${GITHUB_SHA}" \
            $(printf "${IMAGE}@sha256:%s " *)
          docker buildx imagetools inspect "${IMAGE}:latest"
