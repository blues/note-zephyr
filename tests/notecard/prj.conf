CONFIG_ZTEST=y

# Notecard libraries
CONFIG_NEWLIB_LIBC=y # Required by `note-c`
CONFIG_BLUES_NOTECARD=y

# The suite issues hub.set with this Product UID. It is never synced, so it
# only has to be well-formed, not a project you own.
CONFIG_BLUES_NOTEHUB_PRODUCT_UID="com.blues.note-zephyr.hil"

# Logging, so a failure on real hardware leaves something to read.
CONFIG_LOG=y
CONFIG_BLUES_NOTECARD_LOGGING=y

# The console is on USB CDC ACM (see required_snippets in testcase.yaml), so
# the port disappears while the board is flashed and reappears only once USB
# has re-enumerated. Hold off the test run long enough for twister to reopen
# it, otherwise the ztest banner is emitted into a port nobody is reading yet.
CONFIG_BOOT_DELAY=3000

# note-c builds JSON requests on the heap, and the ztest thread has to be big
# enough to hold the transport's stack frames on top of that.
CONFIG_HEAP_MEM_POOL_SIZE=8192
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_ZTEST_STACK_SIZE=4096
